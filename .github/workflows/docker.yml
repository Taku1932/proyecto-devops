name: CI - Sistema de Reservas Medicas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker
        run: docker build -t reservas-medicas:test .

      - name: Verificar imagen Docker
        run: docker image inspect reservas-medicas:test

      - name: Iniciar contenedor de prueba
        run: docker run -d --name reservas-test -p 127.0.0.1:8080:80 reservas-medicas:test

      - name: Verificar funcionamiento web
        run: |
         for i in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/; then
           echo "Aplicacion web funcionando correctamente"
             exit 0
             fi
           echo "Esperando que el servidor web este disponible..."
            sleep 3
            done
           echo "ERROR: El servidor web no respondio"
           docker logs reservas-test
          exit 1

      - name: Detener contenedor de prueba
        if: always()
        run: docker rm -f reservas-test

        
      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Iniciar aplicacion con Docker Compose
        run: docker compose up -d --build

      - name: Verificar aplicacion con Docker Compose
        run: |
          for i in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/; then
              echo "Aplicacion con Docker Compose funcionando correctamente"
              exit 0
            fi
            echo "Esperando que Docker Compose inicie la aplicacion..."
            sleep 3
          done
          echo "ERROR: La aplicacion no respondio"
          docker compose logs
          exit 1

      - name: Detener Docker Compose
        if: always()
        run: docker compose down
