name: CI - Sistema de Reservas Medicas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker
        run: docker build -t reservas-medicas:test .

      - name: Verificar imagen Docker
        run: docker image inspect reservas-medicas:test

      - name: Iniciar contenedor de prueba
        run: docker run -d --name reservas-test -p 8080:80 reservas-medicas:test

      - name: Verificar funcionamiento web
        run: |
          curl --fail --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8080/

      - name: Detener contenedor de prueba
        if: always()
        run: docker rm -f reservas-test