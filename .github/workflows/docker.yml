name: CI - Sistema de Reservas Medicas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker
        run: docker build -t reservas-medicas:test .

      - name: Verificar imagen Docker
        run: docker image inspect reservas-medicas:test
